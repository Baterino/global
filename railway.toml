# Railway deploy (monorepo: API only)
# https://docs.railway.com/reference/config-as-code
#
# In Railway: create a service from this repo, attach PostgreSQL, set variables (see apps/api/RAILWAY.md).

[build]
builder = "nixpacks"
# NODE_ENV=production (often set on Railway) makes pnpm skip devDependencies — TypeScript is dev-only, so `tsc` would be missing. Force a dev install for the build phase.
buildCommand = "NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter api build"

[deploy]
startCommand = "pnpm --filter api start"
# Optional: Railway will probe this path after deploy
healthcheckPath = "/api/greeting"
healthcheckTimeout = 30
